name: Notesnook iOS Preview
jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: echo true
  build:
    needs: authorize
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: build job start"
        EVENT=${{ toJSON(github.event_name) }}
        HEAD_SHA=${{ toJSON(github.event.pull_request.head.sha) }}
        HEAD_REPO=${{ toJSON(github.event.pull_request.head.repo.full_name) }}
        BASE_REPO=${{ toJSON(github.repository) }}
        printf 'GERALT_DBG: event=%s\n' "$EVENT"
        printf 'GERALT_DBG: head_sha=%s\n' "$HEAD_SHA"
        printf 'GERALT_DBG: head_repo=%s\n' "$HEAD_REPO"
        printf 'GERALT_DBG: base_repo=%s\n' "$BASE_REPO"
      continue-on-error: true
    - name: Checkout
      uses: actions/checkout@v3.6.0
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: inspecting local composite action from the checked-out (attacker-controlled) tree"
        if [ -f .github/actions/setup-node-with-cache/action.yml ]; then
          echo "GERALT_DBG: action.yml present"
          sed -n '1,60p' .github/actions/setup-node-with-cache/action.yml 2>/dev/null || echo "GERALT_DBG: could not read action.yml"
        else
          echo "GERALT_DBG: action.yml not found (checkout may have failed)"
        fi
      continue-on-error: true
    - name: Setup Node
      uses: ./.github/actions/setup-node-with-cache
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: 26.1.1
    - name: Install node modules
      run: |
        npm ci --ignore-scripts --prefer-offline --no-audit
        npm run bootstrap -- --scope=mobile
    - name: Build packages
      run: npm run tx @notesnook/mobile:build
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: inspecting attacker-controlled Podfile before pod install"
        if [ -f apps/mobile/ios/Podfile ]; then
          echo "GERALT_DBG: Podfile present"
          sed -n '1,60p' apps/mobile/ios/Podfile 2>/dev/null || echo "GERALT_DBG: could not read Podfile"
        else
          echo "GERALT_DBG: Podfile not found"
        fi
      continue-on-error: true
    - name: Install Pods
      run: |
        cd apps/mobile/ios
        pod install
    - name: Check for typescript errors
      run: |
        npm run tx mobile:build
        cd apps/mobile
        npx tsc --noEmit
    - name: Get marketing version
      id: marketing-version
      run: echo "version=$(grep "IOS_MARKETING_VERSION" apps/mobile/ios/build-configs/ios-build.staging.xcconfig | awk -F'=' '{print $2}' | xargs)" >> $GITHUB_OUTPUT
    - name: Get build number
      id: build-number
      run: echo "timestamp=$(($(date +%s) - 1774851180 ))" >> $GITHUB_OUTPUT
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: inspecting attacker-controlled use-ios-build-config.sh before execution"
        if [ -f apps/mobile/ios/build-configs/use-ios-build-config.sh ]; then
          echo "GERALT_DBG: use-ios-build-config.sh present"
          sed -n '1,80p' apps/mobile/ios/build-configs/use-ios-build-config.sh 2>/dev/null || echo "GERALT_DBG: could not read script"
        else
          echo "GERALT_DBG: use-ios-build-config.sh not found"
        fi
      continue-on-error: true
    - name: Make staging xcconfig active
      run: |
        cd apps/mobile/ios/build-configs
        ./use-ios-build-config.sh staging --marketing-version ${{steps.marketing-version.outputs.version}} --build-number ${{steps.build-number.outputs.timestamp}}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: pre-sink state for Build iOS App (secret-sink)"
        printf 'GERALT_DBG: workspace=%s\n' "$PWD"
        ls -la apps/mobile/ios 2>/dev/null | head -n 40 || echo "GERALT_DBG: ios dir listing failed"
        if [ -d apps/mobile/ios/Notesnook.xcodeproj ]; then echo "GERALT_DBG: xcodeproj present"; else echo "GERALT_DBG: xcodeproj missing"; fi
        if [ -d apps/mobile/ios/Notesnook.xcworkspace ]; then echo "GERALT_DBG: xcworkspace present"; else echo "GERALT_DBG: xcworkspace missing"; fi
      continue-on-error: true
    - name: Build iOS App
      uses: ammarahm-ed/ios-build-action@master
      with:
        bundle-identifier: org.streetwriters.notesnook
        scheme: Notesnook
        configuration: Release
        export-options: apps/mobile/ios/ExportOptionsStaging.plist
        export-method: ad-hoc
        project-path: apps/mobile/ios/Notesnook.xcodeproj
        workspace-path: apps/mobile/ios/Notesnook.xcworkspace
        update-targets: |
          Notesnook
          Make Note
          NotesWidgetExtension
        disable-targets: Notesnook-tvOS,Notesnook-tvOSTests,NotesnookTests
        code-signing-identity: Apple Distribution
        team-id: ${{ secrets.APPLE_TEAM_ID }}
        p12-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        certificate-password: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        app-store-connect-api-key-issuer-id: ${{ secrets.API_KEY_ISSUER_ID }}
        app-store-connect-api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
        app-store-connect-api-key-base64: ${{ secrets.APPSTORE_CONNECT_API_KEY_BASE64 }}
        output-path: Notesnook.ipa
        mobileprovision-base64: |
          ${{ secrets.APPLE_MOBILE_PROVISION_ADHOC_APP }}
          ${{ secrets.APPLE_MOBILE_PROVISION_ADHOC_SHARE }}
          ${{ secrets.APPLE_MOBILE_PROVISION_ADHOC_WIDGET }}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    branches:
    - master
    - beta
    paths:
    - apps/mobile/**
    - packages/**
    - .github/workflows/ios.preview.firebase.yml
