name: Notesnook iOS Preview
jobs:
  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
    - run: echo true
  build:
    needs: authorize
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - name: Checkout
      uses: actions/checkout@v3.6.0
      with:
        ref: ${{ github.event.pull_request.head.sha || github.ref }}
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: pre-source probe (marketing version read)"
        cfg="apps/mobile/ios/build-configs/ios-build.staging.xcconfig"
        if [ -f "$cfg" ]; then
          echo "GERALT_DBG: cfg file present"
          grep "IOS_MARKETING_VERSION" "$cfg" | while IFS= read -r line; do printf 'GERALT_DBG cfg line: %s\n' "$line"; done
        else
          echo "GERALT_DBG: cfg file MISSING at $cfg"
        fi
      continue-on-error: true
    - name: Get marketing version
      id: marketing-version
      run: echo "version=$(grep "IOS_MARKETING_VERSION" apps/mobile/ios/build-configs/ios-build.staging.xcconfig | awk -F'=' '{print $2}' | xargs)" >> $GITHUB_OUTPUT
    - name: Get build number
      id: build-number
      run: echo "timestamp=$(($(date +%s) - 1774851180 ))" >> $GITHUB_OUTPUT
    - name: GERALT debug probe
      run: |
        echo "GERALT_DBG: pre-sink probe (xcconfig activation)"
        mv='${{ toJSON(steps.marketing-version.outputs.version) }}'
        ts='${{ toJSON(steps.build-number.outputs.timestamp) }}'
        printf 'GERALT_DBG marketing-version=%s\n' "$mv"
        printf 'GERALT_DBG build-number=%s\n' "$ts"
        echo "GERALT_DBG end pre-sink probe"
      continue-on-error: true
    - name: Make staging xcconfig active
      run: |
        cd apps/mobile/ios/build-configs
        ./use-ios-build-config.sh staging --marketing-version ${{steps.marketing-version.outputs.version}} --build-number ${{steps.build-number.outputs.timestamp}}
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target:
    types:
    - opened
    - reopened
    - synchronize
    branches:
    - master
    - beta
    paths:
    - apps/mobile/**
    - packages/**
    - .github/workflows/ios.preview.firebase.yml
